platform: gpio
internal: true
id: indicator_button
name: "Indicator Button"
pin:
  number: GPIO38
  inverted: yes
  mode:
    input: true
    pullup: true
on_press:
  then:
    - if:
        condition: lvgl.is_paused
        then:
          # Screen is off: wake it and always start back at the first tile.
          - script.execute: activity_detected
          - lvgl.tileview.select:
              id: main_tileview
              row: 0
              column: 0
        else:
          # Screen is on: advance to the next tile, or turn off if we were
          # already on the last one.
          - if:
              condition:
                lambda: 'return id(current_tile_index) + 1 < ${total_pages};'
              then:
                - lvgl.tileview.select:
                    id: main_tileview
                    row: 0
                    column: !lambda 'return id(current_tile_index) + 1;'
                    animated: true
              else:
                - script.execute: activity_timeout_reached
